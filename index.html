<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chokepoint Monitor</title>
  <meta name="description" content="Daily ship transits through the Suez Canal, the Strait of Hormuz, the Panama Canal and the Strait of Malacca, with the events that moved them. Data from IMF PortWatch.">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="map" aria-label="Tilted 3D world map with shipping lanes, moving ships and a pin on each chokepoint"></canvas>
  <div id="pin-labels" class="pin-labels"></div>
  <div id="overlay" class="overlay"></div>

  <main class="page">
    <!-- Cards pinned over the map. -->
    <div class="hud">
    <header class="topbar card" id="topbar">
      <a class="brand" href="./" aria-label="Chokepoint Monitor, home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#2f62e6"/>
          <path d="M7 17.5a9 9 0 0 1 18 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
          <path d="M16 17.5l4.6-5.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="16" cy="17.5" r="2" fill="#fff"/>
          <path d="M6.5 23c2.4 0 2.4-1.5 4.8-1.5s2.4 1.5 4.7 1.5 2.4-1.5 4.7-1.5 2.4 1.5 4.8 1.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
        </svg>
        <span>Chokepoint Monitor</span>
      </a>
      <p class="topbar__tagline">Ships through the world's narrowest sea lanes, day by day since 2019</p>
      <div class="topbar__actions" id="topbar-actions"></div>
      <div class="asof" id="asof" title="IMF PortWatch publishes new counts once a week, a few days in arrears"></div>
      <a class="icon-button" href="https://github.com/BenVoliva/chokepoint-monitor" target="_blank" rel="noopener" aria-label="Source code on GitHub" title="Source code on GitHub">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 8l-4.5 4L9 16M15 8l4.5 4L15 16"/></svg>
      </a>
    </header>

    <section class="kpis" id="kpis" aria-label="Headline figures"></section>
    <nav class="toolbar card" id="toolbar" aria-label="Map view"></nav>
    <!-- One of these two shows at a time: the week's summary, or the chokepoint picked on the map. -->
    <aside class="summary card" id="summary" aria-label="The week at all six chokepoints"></aside>
    <aside class="detail card" id="detail" aria-label="Selected chokepoint" hidden></aside>
    <aside class="legend card" id="legend" aria-label="Map legend"></aside>
    </div>

    <!-- The first screen is the map; the timeline, the list and the news sit below it, the top edge showing. -->
    <div class="stage"></div>
    <div class="below" id="below">
      <section class="timeline card" id="timeline" aria-label="Timeline"></section>
      <section class="list card" id="list" aria-label="All chokepoints"></section>
      <section class="news card" id="news" aria-label="News headlines"></section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="loading" id="loading" role="status">Loading the map…</div>
  <noscript><p class="fatal">This page needs JavaScript to draw the map.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
